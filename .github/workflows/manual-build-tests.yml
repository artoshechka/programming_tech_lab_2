name: Manual Build And Tests

on:
  workflow_dispatch:
    inputs:
      run_coverage:
        description: "Сгенерировать coverage-отчет"
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DPROGRAM_GENERATOR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target program_generator build_tests --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure coverage build
        if: ${{ inputs.run_coverage }}
        run: cmake -S . -B build-coverage -DPROGRAM_GENERATOR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build coverage targets
        if: ${{ inputs.run_coverage }}
        run: cmake --build build-coverage --target program_generator build_tests --parallel

      - name: Run coverage tests
        if: ${{ inputs.run_coverage }}
        run: |
          find build-coverage -name '*.gcda' -delete
          ctest --test-dir build-coverage --output-on-failure

      - name: Install gcovr
        if: ${{ inputs.run_coverage }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Generate coverage report
        if: ${{ inputs.run_coverage }}
        run: |
          if command -v llvm-cov >/dev/null 2>&1; then
              GCOV_EXEC="$(command -v llvm-cov) gcov"
          elif command -v xcrun >/dev/null 2>&1 && xcrun --find llvm-cov >/dev/null 2>&1; then
              GCOV_EXEC="$(xcrun --find llvm-cov) gcov"
          else
              GCOV_EXEC="gcov"
          fi

          cd build-coverage
          rm -f coverage_cpp* coverage_summary.txt
          find . -name '*.gcov' -delete

          gcovr -r .. \
              --gcov-executable "$GCOV_EXEC" \
              --filter ".*/unit/src/.*\.cpp$" \
              --exclude ".*/main\.cpp$" \
              --exclude ".*/tests/.*" \
              --exclude ".*/CMakeFiles/.*" \
              --exclude ".*/build-coverage/.*" \
              --exclude ".*CMakeCXXCompilerId\.cpp$" \
              --exclude ".*\.hpp$" \
              --exclude-unreachable-branches \
              --exclude-throw-branches \
              --decisions \
              --html-details coverage_cpp.html

          gcovr -r .. \
              --gcov-executable "$GCOV_EXEC" \
              --filter ".*/unit/src/.*\.cpp$" \
              --exclude ".*/main\.cpp$" \
              --exclude ".*/tests/.*" \
              --exclude ".*/CMakeFiles/.*" \
              --exclude ".*/build-coverage/.*" \
              --exclude ".*CMakeCXXCompilerId\.cpp$" \
              --exclude ".*\.hpp$" \
              --exclude-unreachable-branches \
              --exclude-throw-branches \
              --decisions \
              --txt \
              --txt-metric decision \
              --print-summary | tee coverage_summary.txt

      - name: Upload coverage artifacts
        if: ${{ inputs.run_coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage_cpp*
            build-coverage/coverage_summary.txt
